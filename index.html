<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>K3 English Phone Practice</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      min-height: 100dvh;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      touch-action: manipulation;        /* kill 300ms iOS delay */
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 3px solid #6366f1; outline-offset: 3px; }

    /* ── App shell ──────────────────────────────────────── */
    .app-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px calc(28px + env(safe-area-inset-bottom));
    }
    @media (max-width: 480px) {
      .app-wrap { padding: 0 10px calc(20px + env(safe-area-inset-bottom)); }
    }

    /* ── Header ─────────────────────────────────────────── */
    .app-header { text-align: center; padding: 24px 16px 18px; }
    .app-header-crown { font-size: 42px; line-height: 1; display: block; }
    .app-header-h1 {
      font-size: clamp(19px, 5vw, 32px);
      font-weight: 900; color: #1e293b;
      margin: 8px 0 4px; line-height: 1.2;
    }
    .app-header-sub {
      font-size: clamp(12px, 3vw, 15px);
      color: #64748b; font-weight: 700;
    }
    @media (max-width: 480px) {
      .app-header { padding: 14px 8px 12px; }
      .app-header-crown { font-size: 32px; }
    }

    /* ── Tab nav — sticky, never wraps, scrollable ──────── */
    .tab-nav {
      background: #fff;
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
      margin-bottom: 12px;
      position: sticky;
      top: 6px;
      z-index: 100;
    }
    .tab-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-wrap: nowrap;                 /* key: never wrap */
      scroll-snap-type: x proximity;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1 0 auto;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: clamp(12px, 2.8vw, 15px);
      font-weight: 800;
      border: none;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: background .18s, color .18s;
      min-height: 40px;
    }
    @media (max-width: 360px) {
      .tab-btn { flex: 0 0 auto; } /* very small screens: natural width */
    }

    /* ── Content card ───────────────────────────────────── */
    .content-card {
      background: #fff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 28px rgba(0,0,0,.09);
    }
    @media (max-width: 480px) {
      .content-card { border-radius: 16px; padding: 16px 13px; }
    }

    /* ── Section header ─────────────────────────────────── */
    .sec-hdr { margin-bottom: 20px; }
    .sec-hdr-title {
      font-size: clamp(18px, 4.5vw, 27px);
      font-weight: 900; color: #1e293b;
      display: flex; align-items: center; gap: 8px; line-height: 1.2;
    }
    .sec-hdr-sub {
      font-size: clamp(12px, 3vw, 15px);
      color: #64748b; font-weight: 700; margin-top: 4px;
    }

    /* ── Audio / Speak buttons ──────────────────────────── */
    .abtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 10px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      transition: background .15s, color .15s, transform .1s;
      white-space: nowrap;
      border-width: 2.5px;
      border-style: solid;
      flex-shrink: 0;
      min-height: 40px;           /* accessible touch target */
    }
    .abtn-full { width: 100%; justify-content: center; }
    .abtn-sm { padding: 7px 12px;  font-size: 14px; }
    .abtn-md { padding: 10px 16px; font-size: 16px; }
    .abtn-lg { padding: 12px 22px; font-size: 18px; }
    .abtn-icon-sm { font-size: 15px; }
    .abtn-icon-md { font-size: 19px; }
    .abtn-icon-lg { font-size: 22px; }
    @media (max-width: 480px) {
      .abtn-sm { padding: 6px 10px; font-size: 13px; }
      .abtn-md { padding: 9px 13px;  font-size: 15px; }
      .abtn-icon-sm { font-size: 13px; }
      .abtn-icon-md { font-size: 17px; }
    }

    /* ── Part 1 – Greeting ──────────────────────────────── */
    .dialogue { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }

    .bubble-row { display: flex; align-items: flex-start; gap: 10px; }
    .bubble-row.is-teacher { flex-direction: row; }
    .bubble-row.is-student { flex-direction: row-reverse; }

    .chat-avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .chat-bubble { border-radius: 16px; padding: 11px 14px; max-width: 80%; }
    .chat-bubble-name { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
    .chat-bubble-text {
      font-size: clamp(14px, 3.8vw, 19px);
      font-weight: 800; color: #1e293b; line-height: 1.5; margin-bottom: 10px;
    }
    @media (max-width: 480px) {
      .chat-avatar { width: 36px; height: 36px; font-size: 18px; }
      .chat-bubble { max-width: 85%; padding: 9px 11px; }
      .chat-bubble-text { margin-bottom: 8px; }
    }

    .response-section {
      background: #FFF7ED; border-radius: 14px;
      padding: 16px; border: 2px solid #FED7AA;
    }
    .response-section-title { font-size: 16px; font-weight: 900; color: #EA580C; margin-bottom: 3px; }
    .response-section-sub   { font-size: 13px; color: #92400E; font-weight: 700; margin-bottom: 12px; }
    .response-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 480px) {
      .response-section { padding: 12px; }
      .response-grid { gap: 6px; }
    }

    /* ── Part 2 – Conversation ──────────────────────────── */
    .q-blocks { display: flex; flex-direction: column; gap: 20px; }

    .q-block {
      background: #fff; border-radius: 16px;
      padding: 18px; box-shadow: 0 2px 18px rgba(0,0,0,.07);
    }
    @media (max-width: 480px) {
      .q-block { padding: 13px; border-radius: 13px; }
      .q-blocks { gap: 14px; }
    }

    /* Teacher question row — stacks vertically on narrow screens */
    .teacher-q-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .teacher-q-box {
      flex: 1; background: #EFF6FF;
      border-radius: 11px; padding: 9px 13px;
      border: 2px solid #BFDBFE; min-width: 0;
    }
    .teacher-q-label { font-size: 12px; font-weight: 700; color: #2563EB; margin-bottom: 4px; }
    .teacher-q-text  { font-size: clamp(14px, 3.5vw, 18px); font-weight: 800; color: #1e293b; line-height: 1.4; }
    @media (max-width: 520px) {
      .teacher-q-row { flex-direction: column; gap: 8px; }
    }

    .q-hint { font-size: 13px; color: #94a3b8; font-weight: 700; font-style: italic; margin-bottom: 12px; }

    .opt-wrap  { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .opt-btn   {
      border-radius: 11px; padding: 9px 14px;
      font-size: clamp(14px, 3.5vw, 17px); font-weight: 800;
      display: flex; align-items: center; gap: 6px;
      transition: all .15s; cursor: pointer;
      font-family: 'Nunito', sans-serif; min-height: 44px;
      border-width: 2.5px; border-style: solid;
    }
    .opt-btn-emoji { font-size: clamp(18px, 4vw, 22px); }

    .result-row {
      background: #F0FDF4; border: 2px solid #86EFAC;
      border-radius: 11px; padding: 11px 13px;
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
      flex-wrap: wrap;
    }
    .result-text {
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 900; color: #15803D; flex: 1; min-width: 0;
    }

    /* ── Part 3 – Phonics ───────────────────────────────── */
    .phonics-mode-btns { display: flex; gap: 8px; margin-bottom: 18px; }
    .phonics-mode-btn  {
      padding: 9px 18px; border-radius: 10px;
      font-size: clamp(13px, 3.2vw, 16px); font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer;
      transition: all .15s; min-height: 42px;
      border-width: 2.5px; border-style: solid;
    }

    .phonics-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 560px) { .phonics-cols { grid-template-columns: 1fr; gap: 18px; } }

    .phonics-group-hdr {
      border-radius: 10px; padding: 8px 13px;
      font-size: clamp(13px, 3vw, 17px); font-weight: 900;
      text-align: center; margin-bottom: 10px;
      border-width: 2px; border-style: solid;
    }

    .phonics-card {
      background: #fff; border-radius: 13px;
      padding: 11px 13px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border-width: 2px; border-style: solid;
    }
    .phonics-card-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px;
    }
    .phonics-card-word-row { display: flex; align-items: center; gap: 8px; }
    .phonics-emoji { font-size: clamp(22px, 4.5vw, 30px); }
    .phonics-word  { font-size: clamp(24px, 5.5vw, 36px); font-weight: 900; color: #1e293b; }

    .chunk-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 7px;
    }
    .chunk-pill {
      padding: 4px 10px; border-radius: 7px;
      font-size: clamp(16px, 3.5vw, 22px); font-weight: 900;
      border-width: 2.5px; border-style: solid; display: inline-block;
    }

    /* Quiz */
    .progress-row {
      display: flex; justify-content: space-between;
      font-size: 14px; font-weight: 700; color: #64748b; margin-bottom: 12px;
    }
    .progress-bar {
      height: 8px; background: #e2e8f0; border-radius: 99px; margin-bottom: 20px; overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }

    .quiz-card {
      background: #fff; border-radius: 20px; padding: 24px 16px;
      text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.10);
      margin-bottom: 20px; transition: border-color .2s;
      border-width: 3px; border-style: solid;
    }
    .quiz-emoji    { font-size: clamp(44px, 10vw, 60px); margin-bottom: 8px; display: block; }
    .quiz-word-row { display: inline-flex; align-items: center; gap: 10px; }
    .quiz-word     { font-size: clamp(32px, 8vw, 52px); font-weight: 900; color: #1e293b; }

    .quiz-label { font-size: clamp(14px, 3.5vw, 18px); font-weight: 700; color: #64748b; text-align: center; margin-bottom: 14px; }
    .quiz-ae-row { display: flex; gap: 14px; justify-content: center; }
    .quiz-ae-btn {
      border-radius: 16px;
      width: clamp(100px, 28vw, 138px);
      padding: 16px 0;
      font-size: clamp(26px, 7vw, 40px); font-weight: 900;
      color: #fff; border: none;
      font-family: 'Nunito', sans-serif; transition: all .15s;
    }

    .quiz-result { text-align: center; padding: 24px 12px; }
    .quiz-result-trophy { font-size: clamp(52px, 12vw, 72px); }
    .quiz-result-score { font-size: clamp(26px, 7vw, 38px); font-weight: 900; margin: 12px 0 6px; }
    .quiz-result-msg { font-size: clamp(14px, 3.5vw, 19px); color: #64748b; font-weight: 700; margin-bottom: 24px; }
    .quiz-restart-btn {
      background: #7C3AED; color: #fff; border: none;
      border-radius: 14px; padding: 14px 36px;
      font-size: clamp(17px, 4vw, 22px); font-weight: 900;
      font-family: 'Nunito', sans-serif; cursor: pointer;
    }

    /* ── Part 4 – Rhymes & Songs ────────────────────────── */
    .section-label {
      font-size: clamp(14px, 3.2vw, 17px); font-weight: 900;
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }

    .rhyme-card {
      background: #fff; border-radius: 16px;
      padding: 16px; box-shadow: 0 2px 18px rgba(0,0,0,.08);
    }
    .rhyme-hdr {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .rhyme-hdr-info { display: flex; align-items: center; gap: 8px; }
    .rhyme-hdr-emoji { font-size: 24px; }
    .rhyme-hdr-title { font-size: clamp(16px, 4vw, 20px); font-weight: 900; color: #1e293b; }
    .rhyme-hdr-ref   { font-size: 11px; color: #94a3b8; font-weight: 700; }

    .play-all-btn {
      border-radius: 10px; padding: 8px 14px;
      font-size: clamp(13px, 3vw, 15px); font-weight: 800;
      display: flex; align-items: center; gap: 6px;
      transition: all .15s; white-space: nowrap; cursor: pointer;
      font-family: 'Nunito', sans-serif; min-height: 38px;
      border-width: 2.5px; border-style: solid;
    }

    .lyric-lines { display: flex; flex-direction: column; gap: 5px; }
    .lyric-line  {
      display: flex; align-items: center; gap: 9px;
      border-radius: 10px; padding: 9px 11px; transition: all .2s;
      border-width: 2px; border-style: solid;
    }
    .lyric-play-btn {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; transition: all .15s;
      border-width: 2.5px; border-style: solid;
    }
    .lyric-text {
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 700; line-height: 1.6; white-space: pre-line;
    }

    .song-cards { display: flex; flex-direction: column; gap: 9px; }
    .song-card  {
      background: #fff; border-radius: 13px; padding: 12px 14px;
      display: flex; align-items: center; gap: 11px;
      transition: all .2s; border-width: 2.5px; border-style: solid;
    }
    .song-emoji { font-size: clamp(24px, 5vw, 30px); flex-shrink: 0; }
    .song-info  { flex: 1; min-width: 0; }
    .song-title { font-size: clamp(15px, 3.8vw, 19px); font-weight: 900; color: #1e293b; }
    .song-ref   { font-size: 11px; color: #94a3b8; font-weight: 700; margin-top: 2px; }
    .song-play-btn {
      border-radius: 10px; padding: 8px 14px;
      font-size: clamp(13px, 3vw, 15px); font-weight: 800;
      display: flex; align-items: center; gap: 6px;
      transition: all .15s; white-space: nowrap; cursor: pointer;
      font-family: 'Nunito', sans-serif; min-height: 38px;
      border-width: 2.5px; border-style: solid; flex-shrink: 0;
    }

    /* ── Animations ─────────────────────────────────────── */
    @keyframes pop {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.06); }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .65; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-pop    { animation: pop    .3s cubic-bezier(.34,1.56,.64,1) both; }
    .anim-pulse  { animation: pulse  .8s ease infinite; }
    .anim-shake  { animation: shake  .4s ease; }
    .anim-slideUp{ animation: slideUp .3s ease both; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ══════════════════════════════════════════════════════
//  LESSON DATA
// ══════════════════════════════════════════════════════
const DATA = {
  greeting: {
    lines: [
      {
        role: 'S',
        text: "Hello! This is [Student's Name]. Who is this?",
        audio: "ref/greeting/greeting_s_hello.mp3",
      },
      {
        role: 'T',
        text: "This is Teacher Nick. How are you?",
        audio: "ref/greeting/greeting_t_how.mp3",
      },
    ],
    responses: [
      { text: "I'm okay.",  emoji: "😊", audio: "ref/greeting/greeting_s_okay.mp3"  },
      { text: "I'm happy.", emoji: "😄", audio: "ref/greeting/greeting_s_happy.mp3" },
      { text: "I'm good.",  emoji: "👍", audio: "ref/greeting/greeting_s_good.mp3"  },
      { text: "I'm tired.", emoji: "😴", audio: "ref/greeting/greeting_s_tired.mp3" },
      { text: "I'm great!", emoji: "🌟", audio: "ref/greeting/greeting_s_great.mp3" },
    ],
  },

  conversation: [
    {
      id: 'q1',
      ref: 'TB p. 24–25',
      qText: "In the fairy tale world, who do you want to be? Why?",
      qAudio: "ref/conversation/conv_t_q1.mp3",
      hint: "I want to be a _____ because _____.",
      buildSentence: (o) => `I want to be a ${o.role} because ${o.reason}.`,
      options: [
        { role: 'queen',    reason: 'they are kind',   emoji: '👸', audio: 'ref/conversation/conv_q1_queen.mp3'    },
        { role: 'king',     reason: 'they are smart',  emoji: '🤴', audio: 'ref/conversation/conv_q1_king.mp3'     },
        { role: 'princess', reason: 'they are pretty', emoji: '👑', audio: 'ref/conversation/conv_q1_princess.mp3' },
        { role: 'prince',   reason: 'they are strong', emoji: '🫅', audio: 'ref/conversation/conv_q1_prince.mp3'   },
        { role: 'knight',   reason: 'they are brave',  emoji: '⚔️', audio: 'ref/conversation/conv_q1_knight.mp3'  },
      ],
    },
    {
      id: 'q2',
      ref: 'TB p. 26',
      qText: "Which fairy tale story do you like?",
      qAudio: "ref/conversation/conv_t_q2.mp3",
      hint: "I like _____.",
      buildSentence: (o) => `I like ${o.story}.`,
      options: [
        { story: 'Snow White',           emoji: '🍎', audio: 'ref/conversation/conv_q2_snowwhite.mp3'     },
        { story: 'Peter Pan',            emoji: '🧚', audio: 'ref/conversation/conv_q2_peterpan.mp3'      },
        { story: 'Cinderella',           emoji: '👠', audio: 'ref/conversation/conv_q2_cinderella.mp3'    },
        { story: 'Sleeping Beauty',      emoji: '😴', audio: 'ref/conversation/conv_q2_sleepingbeauty.mp3'},
        { story: 'Beauty and the Beast', emoji: '🌹', audio: 'ref/conversation/conv_q2_beautyandbeast.mp3'},
        { story: 'The Three Little Pigs',emoji: '🐷', audio: 'ref/conversation/conv_q2_threelittlepigs.mp3'},
      ],
    },
    {
      id: 'q3',
      ref: 'TB p. 28–29',
      qText: "What do you want to be when you grow up?",
      qAudio: "ref/conversation/conv_t_q3.mp3",
      hint: "I want to be a/an _____.",
      buildSentence: (o) => `I want to be ${o.article} ${o.job}.`,
      options: [
        { job: 'chef',           article: 'a',  emoji: '👨‍🍳', audio: 'ref/conversation/conv_q3_chef.mp3'         },
        { job: 'doctor',         article: 'a',  emoji: '👨‍⚕️', audio: 'ref/conversation/conv_q3_doctor.mp3'       },
        { job: 'astronaut',      article: 'an', emoji: '🚀',  audio: 'ref/conversation/conv_q3_astronaut.mp3'    },
        { job: 'teacher',        article: 'a',  emoji: '👩‍🏫', audio: 'ref/conversation/conv_q3_teacher.mp3'      },
        { job: 'firefighter',    article: 'a',  emoji: '🧑‍🚒', audio: 'ref/conversation/conv_q3_firefighter.mp3'  },
        { job: 'baseball player',article: 'a',  emoji: '⚾',  audio: 'ref/conversation/conv_q3_baseballplayer.mp3'},
        { job: 'mail carrier',   article: 'a',  emoji: '📬', audio: 'ref/conversation/conv_q3_mailcarrier.mp3'  },
        { job: 'dentist',        article: 'a',  emoji: '🦷', audio: 'ref/conversation/conv_q3_dentist.mp3'      },
        { job: 'nurse',          article: 'a',  emoji: '👩‍⚕️', audio: 'ref/conversation/conv_q3_nurse.mp3'       },
        { job: 'businessman',    article: 'a',  emoji: '💼', audio: 'ref/conversation/conv_q3_businessman.mp3'  },
        { job: 'waitress',       article: 'a',  emoji: '🍽️', audio: 'ref/conversation/conv_q3_waitress.mp3'     },
        { job: 'police officer', article: 'a',  emoji: '👮', audio: 'ref/conversation/conv_q3_policeofficer.mp3'},
      ],
    },

// ══════════════════════════════════════════════════════
//  TTS HOOK  (logic unchanged)
// ══════════════════════════════════════════════════════
function useTTS() {
  const [voices, setVoices] = useState([]);
  const [speakingId, setSpeakingId] = useState(null);
  const supported = 'speechSynthesis' in window;

  useEffect(() => {
    if (!supported) return;
    const load = () => {
      const v = window.speechSynthesis.getVoices();
      if (v.length) setVoices(v);
    };
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
    return () => window.speechSynthesis.removeEventListener('voiceschanged', load);
  }, [supported]);

  const speak = useCallback((text, isTeacher, id = 'default') => {
    if (!supported) return;
    window.speechSynthesis.cancel();
    setSpeakingId(id);
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang  = 'en-US';
    utter.rate  = isTeacher ? 0.9 : 0.85;
    utter.volume = 1;
    const enUS = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
    const enAll = voices.filter(v => v.lang.startsWith('en'));
    const pool  = enUS.length ? enUS : enAll;
    if (isTeacher) {
      utter.pitch = 1.0;
      const v = pool.find(v => /samantha|zira|victoria|karen|moira|google us english/i.test(v.name)) || pool[0];
      if (v) utter.voice = v;
    } else {
      utter.pitch = 1.2;
      const v = pool.find(v => /alex|daniel|fred|mark|david|george|tom|junior/i.test(v.name))
             || (pool.length > 1 ? pool[pool.length - 1] : pool[0]);
      if (v) utter.voice = v;
    }
    utter.onend   = () => setSpeakingId(null);
    utter.onerror = () => setSpeakingId(null);
    window.speechSynthesis.speak(utter);
  }, [voices, supported]);

  const stop = useCallback(() => {
    if (supported) window.speechSynthesis.cancel();
    setSpeakingId(null);
  }, [supported]);

  return { speak, stop, speakingId, supported };
}

// Context for sharing speakingId
const SpeakingCtx = React.createContext(null);
function useSpeakingId() { return React.useContext(SpeakingCtx); }

// TTS button — layout via CSS class, colors inline
function SpeakBtn({ text, isTeacher, speak, id, label, size = 'md', fullWidth = false }) {
  const { speakingId } = useSpeakingId();
  const active  = speakingId === id;
  const color   = isTeacher ? '#2563EB' : '#EA580C';
  const bgIdle  = isTeacher ? '#EFF6FF' : '#FFF7ED';
  return (
    <button
      onClick={() => speak(text, isTeacher, id)}
      className={`abtn abtn-${size}${active ? ' anim-pulse' : ''}${fullWidth ? ' abtn-full' : ''}`}
      style={{
        background: active ? color : bgIdle,
        borderColor: color,
        color: active ? '#fff' : color,
        transform: active ? 'scale(.97)' : 'scale(1)',
      }}
    >
      <span className={`abtn-icon-${size}`}>{active ? '🔊' : '🔈'}</span>
      {label}
    </button>
  );
}

// Static MP3 button — layout via CSS class, colors inline
function AudioBtn({ src, isTeacher, label, size = 'md' }) {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const color  = isTeacher ? '#2563EB' : '#EA580C';
  const bgIdle = isTeacher ? '#EFF6FF' : '#FFF7ED';

  const handleClick = () => {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.currentTime = 0;
    }
    const audio = new Audio(src);
    audioRef.current = audio;
    audio.onplay  = () => setPlaying(true);
    audio.onended = () => setPlaying(false);
    audio.onerror = () => { setPlaying(false); console.warn('Audio failed:', src); };
    audio.play().catch(() => setPlaying(false));
  };

  return (
    <button
      onClick={handleClick}
      className={`abtn abtn-${size}${playing ? ' anim-pulse' : ''}`}
      style={{
        background: playing ? color : bgIdle,
        borderColor: color,
        color: playing ? '#fff' : color,
      }}
    >
      <span className={`abtn-icon-${size}`}>{playing ? '🔊' : '🔈'}</span>
      {label}
    </button>
  );
}

function PhonicsQuiz({ speak }) {
  const allWords = [
    ...DATA.phonics.longA.map(w => ({ ...w, type: 'A' })),
    ...DATA.phonics.longE.map(w => ({ ...w, type: 'E' })),
  ];
  const shuffle = arr => [...arr].sort(() => Math.random() - .5);
  const [words]               = useState(() => shuffle(allWords));
  const [idx, setIdx]         = useState(0);
  const [score, setScore]     = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [done, setDone]       = useState(false);
  const [animKey, setAnimKey] = useState(0);
  const current = words[idx];

  useEffect(() => {
    if (current) setTimeout(() => new Audio(current.audio).play().catch(console.warn), 350);
  }, [idx]);

  const answer = (guess) => {
    if (feedback) return;
    const ok = guess === current.type;
    if (ok) setScore(s => s + 1);
    setFeedback(ok ? 'correct' : 'wrong');
    setAnimKey(k => k + 1);
    setTimeout(() => {
      if (idx + 1 >= words.length) { setDone(true); }
      else { setIdx(i => i + 1); setFeedback(null); }
    }, 1300);
  };

  const restart = () => { setIdx(0); setScore(0); setFeedback(null); setDone(false); setAnimKey(0); };

  if (done) {
    const pct = score / words.length;
    return (
      <div className="quiz-result anim-pop">
        <div className="quiz-result-trophy">{pct >= .8 ? '🏆' : pct >= .5 ? '⭐' : '💪'}</div>
        <div className="quiz-result-score">{score} / {words.length}</div>
        <div className="quiz-result-msg">
          {pct >= .8 ? "Amazing! You're a phonics star! 🌟" : pct >= .5 ? "Good job! Keep practicing! 👍" : "Keep trying! You can do it! 💪"}
        </div>
        <button onClick={restart} className="quiz-restart-btn">🔄 Play Again</button>
      </div>
    );
  }

  const A_COLOR   = '#7C3AED';
  const E_COLOR   = '#059669';
  const feedColor = feedback === 'correct' ? '#16A34A' : '#DC2626';

  return (
    <div>
      <div className="progress-row">
        <span>Question {idx + 1} / {words.length}</span>
        <span>⭐ {score} correct</span>
      </div>
      <div className="progress-bar">
        <div className="progress-fill" style={{ width: `${((idx + 1) / words.length) * 100}%`, background: '#7C3AED' }} />
      </div>

      <div key={animKey} className="quiz-card anim-pop" style={{ borderColor: feedback ? feedColor : 'transparent' }}>
        <span className="quiz-emoji">{current.emoji}</span>
        <div className="quiz-word-row">
          <span className="quiz-word">{current.word}</span>
          <AudioBtn src={current.audio} isTeacher={false} label="Hear" size="md" />
        </div>
        {feedback && (
          <div className="anim-slideUp" style={{ fontSize: 'clamp(16px,4vw,22px)', fontWeight: 900, marginTop: 14, color: feedColor }}>
            {feedback === 'correct' ? `✅ Yes! Long ${current.type}!` : `❌ It's Long ${current.type}! Try again next time.`}
          </div>
        )}
      </div>

      <div className="quiz-label">Is this Long A or Long E?</div>
      <div className="quiz-ae-row">
        {[{ label: 'A', val: 'A', color: A_COLOR }, { label: 'E', val: 'E', color: E_COLOR }].map(({ label, val, color }) => (
          <button
            key={val}
            onClick={() => answer(val)}
            disabled={!!feedback}
            className="quiz-ae-btn"
            style={{
              background: feedback ? '#94a3b8' : color,
              opacity: feedback ? .55 : 1,
              cursor: feedback ? 'not-allowed' : 'pointer',
              boxShadow: feedback ? 'none' : `0 6px 18px ${color}55`,
            }}
          >{label}</button>
        ))}
      </div>
    </div>
  );
}

function RhymeCard({ rhyme }) {
  const [active, setActive] = useState(null);
  const [playingAll, setPlayingAll] = useState(false);
  const audioRef = useRef(null);
  const seqIdRef = useRef(0);

  const stopCurrent = () => {
    seqIdRef.current++;           // cancel any running sequence
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.currentTime = 0;
      audioRef.current = null;
    }
    setActive(null);
    setPlayingAll(false);
  };

  const playAudio = (src, key) => {
    stopCurrent();
    const audio = new Audio(src);
    audioRef.current = audio;
    setActive(key);
    audio.onended = () => { audioRef.current = null; setActive(null); };
    audio.onerror = () => { audioRef.current = null; setActive(null); };
    audio.play().catch(console.warn);
  };

  const playAll = () => {
    seqIdRef.current++;
    const myId = seqIdRef.current;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    setPlayingAll(true);

    // full audio (title) → every line in order
    const srcs = [rhyme.fullAudio, ...rhyme.lines.map(l => l.audio)];
    const keys = ['title', ...rhyme.lines.map((_, i) => i)];
    let i = 0;

    const playNext = () => {
      if (seqIdRef.current !== myId) return;   // stopped externally
      if (i >= srcs.length) { setActive(null); setPlayingAll(false); return; }
      const src = srcs[i];
      const key = keys[i];
      i++;
      const audio = new Audio(src);
      audioRef.current = audio;
      setActive(key);
      audio.onended = playNext;
      audio.onerror = playNext;
      audio.play().catch(() => playNext());
    };
    playNext();
  };

  const isAllPlaying = playingAll;
  const PURPLE = '#7C3AED';
  const LIGHT  = '#EDE9FE';

  return (
    <div className="rhyme-card">
      <div className="rhyme-hdr">
        <div className="rhyme-hdr-info">
          <span className="rhyme-hdr-emoji">{rhyme.emoji}</span>
          <div>
            <div className="rhyme-hdr-title">{rhyme.title}</div>
            <div className="rhyme-hdr-ref">📖 {rhyme.ref}</div>
          </div>
        </div>
        <button
          onClick={() => isAllPlaying ? stopCurrent() : playAll()}
          className={`play-all-btn${isAllPlaying ? ' anim-pulse' : ''}`}
          style={{
            background: isAllPlaying ? PURPLE : LIGHT,
            borderColor: PURPLE,
            color: isAllPlaying ? '#fff' : PURPLE,
          }}
        >
          <span>{isAllPlaying ? '⏹' : '▶'}</span>
          {isAllPlaying ? 'Stop' : 'Play All'}
        </button>
      </div>

      <div className="lyric-lines">
        {rhyme.lines.map((line, idx) => {
          const isLinePlaying = active === idx;
          return (
            <div
              key={idx}
              className="lyric-line"
              style={{
                background:   isLinePlaying ? LIGHT : '#F8FAFC',
                borderColor:  isLinePlaying ? PURPLE : 'transparent',
              }}
            >
              <button
                onClick={() => isLinePlaying ? stopCurrent() : playAudio(line.audio, idx)}
                className="lyric-play-btn"
                style={{
                  background:  isLinePlaying ? PURPLE : '#fff',
                  borderColor: PURPLE,
                  color:       isLinePlaying ? '#fff' : PURPLE,
                }}
              >{isLinePlaying ? '⏹' : '▶'}</button>
              <div className="lyric-text" style={{ color: isLinePlaying ? PURPLE : '#1e293b' }}>
                {line.text}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SongCard({ song }) {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);

  const toggle = () => {
    if (playing) {
      audioRef.current?.pause();
      if (audioRef.current) audioRef.current.currentTime = 0;
      setPlaying(false);
    } else {
      const audio = new Audio(song.audio);
      audioRef.current = audio;
      audio.onended = () => setPlaying(false);
      audio.onerror = () => setPlaying(false);
      audio.play().catch(console.warn);
      setPlaying(true);
    }
  };

  const BLUE = '#2563EB';

  return (
    <div className="song-card" style={{
      borderColor:  playing ? BLUE : '#e2e8f0',
      boxShadow: playing ? `0 4px 18px ${BLUE}33` : '0 2px 8px rgba(0,0,0,.05)',
    }}>
      <span className="song-emoji">{song.emoji}</span>
      <div className="song-info">
        <div className="song-title" style={{ color: playing ? BLUE : '#1e293b' }}>{song.title}</div>
        <div className="song-ref">{song.ref}</div>
      </div>
      <button
        onClick={toggle}
        className={`song-play-btn${playing ? ' anim-pulse' : ''}`}
        style={{
          background:  playing ? BLUE : '#EFF6FF',
          borderColor: BLUE,
          color:       playing ? '#fff' : BLUE,
        }}
      >
        <span>{playing ? '⏹' : '▶'}</span>
        {playing ? 'Stop' : 'Play'}
      </button>
    </div>
  );
}

function Part4() {
  const { rhymes, songs } = DATA.rhymesAndSongs;
  return (
    <div>
      <SectionHeader emoji="🎵" title="Rhyme & Song Time!" sub="Tap a line to practise, or play the whole piece!" />

      <div style={{ marginBottom: 24 }}>
        <div className="section-label" style={{ color: '#7C3AED' }}>📜 Nursery Rhymes</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {rhymes.map(r => <RhymeCard key={r.title} rhyme={r} />)}
        </div>
      </div>

      <div>
        <div className="section-label" style={{ color: '#2563EB' }}>🎵 Songs — tap to play!</div>
        <div className="song-cards">
          {songs.map(s => <SongCard key={s.title} song={s} />)}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  APP ROOT
// ══════════════════════════════════════════════════════
const TABS = [
  { label: '📞 Greeting' },
  { label: '💬 Conversation' },
  { label: '🔤 Phonics' },
  { label: '🎵 Songs' },
];

function App() {
  const { speak, stop, speakingId, supported } = useTTS();
  const [tab, setTab] = useState(0);
  const handleTab = (i) => { stop(); setTab(i); };
  const ctxValue = { speakingId };

  return (
    <SpeakingCtx.Provider value={ctxValue}>
      <div className="app-wrap">

        <header className="app-header">
          <span className="app-header-crown">👑</span>
          <h1 className="app-header-h1">K3 English Phone Practice</h1>
          <p className="app-header-sub">Interactive Telephone Teaching · Fairy Tale World ✨</p>
        </header>

        {!supported && (
          <div style={{ background: '#FEF2F2', border: '2px solid #FECACA', borderRadius: 12, padding: '12px 16px', marginBottom: 12, fontSize: 15, fontWeight: 700, color: '#DC2626' }}>
            ⚠️ Your browser doesn't support Text-to-Speech. Please use <strong>Chrome</strong> or <strong>Safari</strong>.
          </div>
        )}

        <nav className="tab-nav">
          <div className="tab-bar">
            {TABS.map((t, i) => (
              <button
                key={i}
                onClick={() => handleTab(i)}
                className="tab-btn"
                style={{
                  background: tab === i ? '#1e293b' : 'transparent',
                  color:      tab === i ? '#fff'    : '#64748b',
                }}
              >
                {t.label}
              </button>
            ))}
          </div>
        </nav>

        <main className="content-card">
          {tab === 0 && <Part1 />}
          {tab === 1 && <Part2 speak={speak} />}
          {tab === 2 && <Part3 speak={speak} />}
          {tab === 3 && <Part4 />}
        </main>

      </div>
    </SpeakingCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
